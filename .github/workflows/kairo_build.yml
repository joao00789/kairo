name: KAIRO Build

# Compila o editor (Linux) e o template Android 2D do KAIRO nos servidores do GitHub.
# Rode manualmente em Actions > "KAIRO Build" > Run workflow, ou crie uma tag (ex.: v0.3.0).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-editor:
    name: Editor Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Python e SCons
        uses: ./.github/actions/godot-deps

      - name: Compilar editor
        run: |
          scons platform=linuxbsd target=editor production=yes \
            module_kairo_enabled=yes accesskit=no wayland=no -j"$(nproc)"
          ls -l bin/

      - uses: actions/upload-artifact@v7
        with:
          name: kairo-editor-linux-x86_64
          path: bin/godot.linuxbsd.editor.x86_64*
          retention-days: 30

  android-template:
    name: Template Android 2D (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Python e SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        id: swappy_sdk
        shell: sh
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy SDK installation failed; building without frame pacing."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar templates (release + debug), 2D apenas
        run: |
          for T in template_release template_debug; do
            scons platform=android target=$T arch=arm64 \
              profile=kairo/engine/android_template_2d.py \
              profiler=none swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }} \
              accesskit=no -j"$(nproc)"
          done

      - name: Gerar APKs/AAR dos templates
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd ../../..
          ls -l bin/

      - uses: actions/upload-artifact@v7
        with:
          name: kairo-android-templates
          path: bin/android_*
          retention-days: 30

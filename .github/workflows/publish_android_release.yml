name: Publish Android APK

on:
  workflow_run:
    workflows: ["🤖 Android Builds"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-apk:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android editor artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: android-editor
          path: release-assets

      - name: Download Android x86_64 editor artifact
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: android-editor-x86_64
          path: release-assets-x86_64

      - name: Publish APK to the tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          arm64_apk="release-assets/android_editor_builds/android_editor-android-debug.apk"
          x86_64_apk="release-assets-x86_64/android_editor_builds/android_editor-android-debug.apk"
          test -s "$arm64_apk"
          test -s "$x86_64_apk"
          mv "$x86_64_apk" release-assets/android_editor_builds/android_editor-android-x86_64-debug.apk

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "KAIRO Engine $RELEASE_TAG" \
              --notes "Android editor APKs for ARM64 and x86_64 Chromebooks/devices for KAIRO Engine $RELEASE_TAG."
          fi

          gh release upload "$RELEASE_TAG" "$arm64_apk" "$x86_64_apk" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
